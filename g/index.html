<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corrida Livre</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background-color: #000;
    }

    #fullscreenBtn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      padding: 10px 15px;
      cursor: pointer;
      background-color: rgba(51, 51, 51, 0.8);
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
      font-family: sans-serif;
      font-weight: bold;
    }

    #fullscreenBtn:hover {
      background-color: #444;
    }
  </style>
</head>
<body>

  <button id="fullscreenBtn">Tela Cheia</button>
  <canvas id="gameCanvas"></canvas>

  <script src="hud.js"></script>
  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
